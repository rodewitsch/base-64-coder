<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="options_title">Settings - Base64Coder</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="../lib.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>
  </head>
  <body>
    <div class="options-container">
      <h1 data-i18n="options_title">Base64Coder Settings</h1>

      <section class="option-group">
        <h2 data-i18n="options_language">Language</h2>
        <select id="language-select">
          <option value="system" data-i18n="options_languageSystem">System default</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh_CN">中文</option>
          <option value="ar">العربية</option>
          <option value="hi">हिन्दी</option>
          <option value="pt_BR">Português</option>
        </select>
      </section>

      <section class="option-group">
        <h2 data-i18n="options_theme">Theme</h2>
        <select id="theme-select">
          <option value="auto" data-i18n="options_themeAuto">Automatic (system)</option>
          <option value="light" data-i18n="options_themeLight">Light</option>
          <option value="dark" data-i18n="options_themeDark">Dark</option>
        </select>
      </section>

      <section class="option-group">
        <h2 data-i18n="options_workMode">Work Mode</h2>
        <div class="radio-group">
          <label>
            <input type="radio" name="workMode" value="tab" />
            <span data-i18n="options_workModeTab">Open in new tab (full page)</span>
          </label>
          <label>
            <input type="radio" name="workMode" value="popup" />
            <span data-i18n="options_workModePopup">Work in popup window</span>
          </label>
        </div>
      </section>

      <section class="option-group">
        <h2 data-i18n="options_defaultEncoding">Default Encoding</h2>
        <select id="default-encoding-select">
          <option value="auto" data-i18n="encoding_auto">Auto-detect</option>
          <option value="utf-8">UTF-8</option>
          <option value="windows-1251">Windows-1251</option>
          <option value="iso-8859-5">ISO-8859-5</option>
          <option value="koi8-r">KOI8-R</option>
          <option value="cp866">CP866</option>
          <option value="utf-16">UTF-16</option>
          <option value="iso-8859-1">ISO-8859-1</option>
        </select>
      </section>

      <p class="saved-msg" id="saved-msg" data-i18n="options_saved">Settings saved</p>
    </div>
  </body>
</html>
