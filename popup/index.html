<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="../lib.js" type="text/javascript"></script>
    <script src="script.js" type="text/javascript"></script>
  </head>
  <body>
    <div class="popup-container">
      <div class="popup-header">
        <select id="encoding-select">
          <option value="auto" data-i18n="encoding_auto">auto</option>
          <option value="utf-8">UTF-8</option>
          <option value="windows-1251">Windows-1251</option>
          <option value="iso-8859-5">ISO-8859-5</option>
          <option value="koi8-r">KOI8-R</option>
          <option value="cp866">CP866</option>
        </select>
        <div class="popup-header-right">
          <button class="btn" id="settings-btn" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button class="btn" id="open-full" title="Open full page">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>
      </div>
      <textarea id="source" data-i18n-placeholder="placeholder_source" placeholder="Enter text or base64..."></textarea>
      <div class="popup-actions">
        <button class="btn action-btn" id="decode-btn" disabled>
          <span data-i18n="btn_text">text</span>
        </button>
        <button class="btn action-btn" id="encode-btn" disabled>
          <span data-i18n="btn_base64">base64</span>
        </button>
        <button class="btn action-btn" id="decode-jwt-btn" disabled>
          <span data-i18n="btn_jwt">jwt</span>
        </button>
        <button class="btn" id="swap-btn" title="Swap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>
      </div>
      <textarea id="result" data-i18n-placeholder="placeholder_result" placeholder="Result..." readonly></textarea>
      <div class="popup-footer">
        <button class="btn" id="copy-result" disabled>
          <span data-i18n="btn_copy">copy</span>
        </button>
        <button class="btn" id="pretty-result" style="display:none">
          <span data-i18n="btn_pretty">pretty</span>
        </button>
        <button class="btn" id="minify-result" style="display:none">
          <span data-i18n="btn_minify">minify</span>
        </button>
        <button class="btn" id="clear-all">
          <span data-i18n="btn_clear">clear</span>
        </button>
      </div>
    </div>
  </body>
</html>
